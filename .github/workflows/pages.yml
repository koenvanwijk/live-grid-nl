name: Refresh live data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Dutch grid snapshot
        env:
          NED_TOKEN: ${{ secrets.NED_TOKEN }}
          TENNET_TOKEN: ${{ secrets.TENNET_TOKEN }}
          ENTSO_E_TOKEN: ${{ secrets.ENTSO_E_TOKEN }}
        run: |
          python scripts/update_live.py
          python scripts/enrich_provenance.py
          python scripts/overlay_ned_generation_mix_v2.py
          python scripts/write_status.py

      - name: Diagnose ENTSO-E balance
        if: always()
        env:
          ENTSO_E_TOKEN: ${{ secrets.ENTSO_E_TOKEN }}
        run: |
          python scripts/diagnose_entsoe_balance.py
          echo '## ENTSO-E raw balance diagnostic' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/entsoe-diagnostics.json'))
          s=d['summary']
          print(f"- timestamp: {d['target_timestamp']}")
          print(f"- load: {s['load_mw']} MW")
          print(f"- production: {s['production_mw']} MW")
          print(f"- generation consumption: {s['generation_consumption_mw']} MW")
          print(f"- net generation: {s['net_generation_mw']} MW")
          print(f"- net import: {s['net_import_mw']} MW")
          print(f"- residual: {s['residual_mw']} MW")
          for country, row in d['a11_borders_at_target'].items():
              print(f"- {country}: import {row['import_mw']} / export {row['export_mw']} / net {row['net_import_mw']} MW")
          print('### A75 raw series')
          for row in d['a75_generation_series_at_target']:
              print(f"- {row.get('psrType')} {row.get('businessType')} {row.get('classification')}: {row.get('mw')} MW · in={row.get('in_domain')} out={row.get('out_domain')} · mRID={row.get('mRID')}")
          PY

      - name: Show snapshot status
        run: |
          cat data/status.json
          echo '## Live grid collector status' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/status.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '## Generation mix freshness' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('data/live.json'))
          for row in d.get('generation_mix',[]):
              print(f"- {row.get('name')}: {row.get('mw')} MW · {row.get('source')} · {row.get('provenance')} · {row.get('measured_at')}")
          PY

      - name: Validate snapshot
        run: |
          python -c "import json; data=json.load(open('data/live.json')); assert data['status']=='ok', data.get('warnings'); assert 'provenance' in data; assert 'generation_by_type' in data; assert data.get('schema_version') == 2; assert 'observations' in data"
          python scripts/validate_observations.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-grid-status-${{ github.run_id }}
          path: |
            data/live.json
            data/status.json
            data/entsoe-diagnostics.json
          retention-days: 14

      - name: Prepare static site
        run: touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
