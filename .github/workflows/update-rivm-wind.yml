name: Update RIVM wind geodata
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_rivm_wind.py'
      - '.github/workflows/update-rivm-wind.yml'
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch, validate and cluster RIVM turbines
        run: python scripts/fetch_rivm_wind.py
      - name: Commit changed data
        if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/onshore-wind-rivm.json
          git diff --cached --quiet || git commit -m 'data: refresh RIVM onshore wind'
          git pull --rebase origin main
          git push
