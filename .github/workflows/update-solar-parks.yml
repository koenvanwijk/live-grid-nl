name: Update solar park geodata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_solar_parks.py'
      - '.github/workflows/update-solar-parks.yml'
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geodata dependencies
        run: pip install --disable-pip-version-check requests pandas openpyxl beautifulsoup4 geopandas pyogrio
      - name: Build solar park dataset
        run: python scripts/update_solar_parks.py
      - name: Validate output
        run: python -c "import json; d=json.load(open('data/solar-parks.json')); assert d['stats']['published_ge25mwp']>0; assert all(p['capacity_mwp']>=25 for p in d['parks']); assert all(p['match_quality'] for p in d['parks'])"
      - name: Commit changed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solar-parks.json
          git diff --cached --quiet || git commit -m 'data: refresh WUR RVO solar parks'
          git pull --rebase origin main
          git push
