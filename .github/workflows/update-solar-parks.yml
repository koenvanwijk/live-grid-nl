name: Update solar park geodata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_solar_parks.py'
      - '.github/workflows/update-solar-parks.yml'
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests
      - name: Build solar park dataset
        run: python scripts/update_solar_parks.py
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/solar-parks.json'))
          s=d['stats']
          parks=d['parks']
          overview=[p for p in parks if p['capacity_mwp'] >= d['overview_threshold_mwp']]
          assert d['schema_version'] == 3
          assert d['overview_threshold_mwp'] == 25.0
          assert s['realised_records_with_capacity'] >= 100
          assert s['physical_parks'] == len(parks) >= 100
          assert s['overview_ge25mwp'] == len(overview) > 0
          assert s['overview_capacity_mwp'] > 25
          assert any(0 < p['capacity_mwp'] < 25 for p in parks), 'LOD dataset must include smaller realised parks'
          assert all(p['capacity_mwp'] > 0 for p in parks)
          assert all(p['match_quality']=='arcgis_physical_location_aggregate' for p in parks)
          PY
      - name: Commit changed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solar-parks.json
          git diff --cached --quiet || git commit -m 'data: refresh full ROM3D solar park set'
          git pull --rebase origin main
          git push
